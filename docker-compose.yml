version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: college-erp-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: college_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college-erp-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/college_erp
      PORT: 5000
      JWT_SECRET: supersecretjwtkey
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: college-erp-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
