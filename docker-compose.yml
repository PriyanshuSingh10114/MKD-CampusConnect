version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college-erp-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: college-erp-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
